# platd.fleet.example.cfg — one file, one command, N shard processes:
#
#   platd --fleet platd.fleet.cfg
#
# Shared keys below apply to every shard; `shardN.key` overrides per shard.
# Each shard is a full platd process: its own core-pinned engine thread, its
# own async journal (+ `.ref` sidecar, own --replay drill), its own CTP
# trader/md session — OrderRef scope is (FrontID, SessionID), so shard order
# ids can never collide, and EOD reconciliation is session-scoped.
#
# Assignment rules (see DEPLOYMENT.md §Sharding):
#   · an instrument lives in EXACTLY ONE shard; strategies follow it;
#   · coupled instruments (arb pairs, spread legs) stay in one shard;
#   · balance shards by message rate × strategy interest, not by count;
#   · rebalance between sessions, never intraday;
#   · risk keys are PER SHARD — slice the account's budget so the sum stays
#     inside the broker/exchange caps.
#
# Per-shard derived defaults (override if you like): site_id/site_name =
# shardN, journal = shardN.jnl, flow dirs ctp_td_shardN/ + ctp_md_shardN/,
# command file shardN.cmd. Operate a running shard from the fleet console
# (`2 halt`, `quit`) or any terminal: `echo halt > shard2.cmd` — including
# per-strategy stop/start: `echo halt 4 > shard3.cmd`, later `disarm 4`.
#
# Strategy lineups are per shard: `shardN.strategies = ...` with
# `shardN.<name>.*` instance blocks (see platd.example.cfg) gives each shard
# its own set of instances — different types, or the same type twice with
# different params — with ids unique within the shard (ids are per-site
# scopes; shards are separate sites). Legacy momentum./meanrev./breakout.
# blocks keep working where no `strategies` key is given (shards 1–2 below).

