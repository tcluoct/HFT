# platd.fleet.example.cfg — one file, one command, N shard processes:
#
#   platd --fleet platd.fleet.cfg
#
# Shared keys below apply to every shard; `shardN.key` overrides per shard.
# Each shard is a full platd process: its own core-pinned engine thread, its
# own async journal (+ `.ref` sidecar, own --replay drill), its own CTP
# trader/md session — OrderRef scope is (FrontID, SessionID), so shard order
# ids can never collide, and EOD reconciliation is session-scoped.
#
# Assignment rules (see DEPLOYMENT.md §Sharding):
#   · an instrument lives in EXACTLY ONE shard; strategies follow it;
#   · coupled instruments (arb pairs, spread legs) stay in one shard;
#   · balance shards by message rate × strategy interest, not by count;
#   · rebalance between sessions, never intraday;
#   · risk keys are PER SHARD — slice the account's budget so the sum stays
#     inside the broker/exchange caps.
#
# Per-shard derived defaults (override if you like): site_id/site_name =
# shardN, journal = shardN.jnl, flow dirs ctp_td_shardN/ + ctp_md_shardN/,
# command file shardN.cmd. Operate a running shard from the fleet console
# (`2 halt`, `quit`) or any terminal: `echo halt > shard2.cmd` — including
# per-strategy stop/start: `echo halt 4 > shard3.cmd`, later `disarm 4`.
#
# Strategy lineups are per shard: `shardN.strategies = ...` with
# `shardN.<name>.*` instance blocks (see platd.example.cfg) gives each shard
# its own set of instances — different types, or the same type twice with
# different params — with ids unique within the shard (ids are per-site
# scopes; shards are separate sites). Legacy momentum./meanrev./breakout.
# blocks keep working where no `strategies` key is given (shards 1–2 below).

# ------------------------------------------------------- shared (all shards)
td_front   = tcp://182.254.243.31:30001
md_front   = tcp://182.254.243.31:30011
broker_id  = 9999
user_id    = 033571
# NEVER commit a real password; use password_env / password_file (see
# platd.example.cfg). The placeholder keeps `--check` shape validation working.
password   = CHANGE_ME
app_id     = simnow_client_test
auth_code  = 0000000000000000
account_id = 1
epoch      = 1
spin       = 1
rt         = 1
default_margin_bps = 1200

# Journal stable-storage cadence (see platd.example.cfg): every burst reaches
# the OS; this bounds a machine-crash window. 0 = fsync only at seal.
journal.sync_ms = 100
journal.snapshot_sec = 300

# Supervisor behaviour: restart an unexpectedly-exited shard with exponential
# backoff (clean EOD exits are never restarted); children are bound to a
# JobObject so a supervisor crash cannot orphan them.
fleet.restart = 1
fleet.max_restarts = 5
fleet.restart_backoff_ms = 1000
fleet.restart_max_backoff_ms = 30000
fleet.quit_grace_ms = 10000

# Optional trading calendar (see platd.example.cfg).
# trade_calendar = trade_calendar.example.txt

# ------------------------------------------------------------------ ops console
# platops reads these keys from this same file. Set a password for anything
# beyond a loopback dev console; a non-loopback bind without one is refused.
# ops.user     = ops
# ops.password = change-me
# ops.bind     = 127.0.0.1
# ops.port     = 8848

risk.max_order_qty       = 20
risk.max_actions_per_day = 6000     # sliced: 3 shards × 6000 < 20k account line
risk.max_actions_per_sec = 80       # sliced: 3 shards × 80  < 250 gate < 300/s line
risk.max_margin_cny      = 1500000  # sliced: 3 × 1.5M inside the account's 5M

fees.fut_per_lot_cny             = 5
fees.fut_per_lot_close_today_cny = 15

# ------------------------------------------------------------------ shard 1
shard1.instruments = cu2612, cu2701
shard1.engine_core  = 2
shard1.journal_core = 3
shard1.momentum.instruments = cu2612, cu2701
shard1.meanrev.instruments  = cu2612
shard1.breakout.instruments = cu2612, cu2701

# ------------------------------------------------------------------ shard 2
shard2.instruments = al2612
shard2.engine_core  = 4
shard2.journal_core = 5
shard2.momentum.instruments = al2612
shard2.meanrev.instruments  = al2612
shard2.breakout.enabled     = 0

# ------------------------------------------------------------------ shard 3
# Instance-list form: two momentum instances with different params/universes
# next to one mean-reversion — a lineup the fixed trio can't express.
shard3.instruments = rb2612, hc2705
shard3.engine_core  = 6
shard3.journal_core = 7
shard3.strategies = mom_rb, mom_hc, rev
shard3.mom_rb.type = momentum
shard3.mom_rb.id   = 1
shard3.mom_rb.instruments = rb2612
shard3.mom_rb.lots = 2
shard3.mom_hc.type = momentum
shard3.mom_hc.id   = 4
shard3.mom_hc.instruments = hc2705
shard3.mom_hc.imb_gate_e4 = 3000
shard3.rev.type = meanrev
shard3.rev.id   = 2
shard3.rev.instruments = rb2612, hc2705
