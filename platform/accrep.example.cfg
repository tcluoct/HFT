# accrep.example.cfg — fills 附件95-3：外部系统接入报告（程序化）.docx from
# this config: text fields + a computed MD5 line only. Copy to accrep.cfg,
# fill in the real values, and keep the real file OUT of version control if
# it names a live APPID/account (see platd.example.cfg for why).
#
# What accrep does NOT do: capture the ~20 screenshots the report also
# requires (穿透式登录, connectivity, order/cancel/close, threshold-alert
# triggers, error handling, emergency controls, logs, file-directory, MD5
# tool, ...), tick the scope checkboxes unless you set them below, or fill
# in 盖章/签字 and the date — those need a person and a live test session
# against the counter.

# ---------------------------------------------------------------- template
template = 附件95-3：外部系统接入报告（程序化）.docx
output   =                           # default: <template name>_filled.docx

# ------------------------------------------------------------------ answers
software_name    = platd
software_version = 1.0.0
trading_system    = CTP              # (CTP、易达、易盛、盛立、艾克等)

# Test account / APPID: the same identity platd.cfg authenticates with (see
# platd.example.cfg) — reuse those values here instead of retyping them.
test_account =                       # defaults to user_id below if blank
user_id      = YOUR_INVESTOR_ID
app_id       = YOUR_APP_ID           # 穿透式监管 terminal id

# Blank unless you actually ran the test terminal through a relay.
relay_app_id   =
relay_proxy_ip =

# Defaults to "now" (when accrep runs) if left blank — set this to match the
# actual test session instead, once you have one.
test_time =

# Local IP/MAC of the TEST TERMINAL default to auto-detected values from the
# first up, non-loopback adapter — override if that's the wrong NIC (e.g. a
# multi-homed box) or the terminal isn't this machine.
local_ip  =
local_mac =

# ------------------------------------------------------- MD5 (§4, optional)
# Path to the deployed binary/package; accrep computes its MD5 and drops a
# line under "软件压缩包（或安装包）的MD5码截图" — still not a substitute for
# the screenshot the report actually asks for.
target_binary = platd.exe

# --------------------------------------------------------- scope checkboxes
# OFF (unchecked) unless set to 1 — only tick what you've actually verified
# in a real test session; ticking a box the software doesn't do misstates
# the filing.
scope.penetration     = 0  # 穿透式监管
scope.interface        = 0  # 接口适应性
scope.program_trading  = 0  # 程序化交易系统（异常监测、阈值管理、错误防范、应急处置、日志记录）
scope.access_security  = 0  # 接入安全性
scope.sub_account      = 0  # 是否具备分账户功能
