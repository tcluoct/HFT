# platrec.example.cfg — market-data recorder configuration.
#
#   platrec platrec.cfg          record the whole market to a .mdr file
#
# Deploy one recorder PER DATACENTER, each with a distinct `source` tag and
# its own `outfile`. After close, compare the files:
#   platrec --compare md_20260715_dc1.mdr md_20260715_dc2.mdr golden.mdr
#
# The recorder only needs a read-only market-data account — no order rights.

# ---- counter (CTP): the trader front is used ONCE, to enumerate every
#      instrument; the md front carries the depth stream.
td_front   = tcp://182.254.243.31:30001
md_front   = tcp://182.254.243.31:30011
broker_id  = 9999
user_id    = 30220792
password   = Lc850511
app_id     = simnow_client_test
auth_code  = 0000000000000000
td_flow_path = rec_td_flow/
md_flow_path = rec_md_flow/

# ---- this recorder's identity + output
source   = dc1                       # datacenter tag, stamped into the file
outfile  =                           # default: md_<day>_<source>.mdr
log_file =                           # persistent session log (append + unbuffered;
                                     # crash post-mortems land here too).
                                     # default: platrec_<date>_<source>.log
writer_core = -1                     # pin the disk-writer thread (colo); -1 = unpinned

# ---- market depth: L1 = level-1 top of book (1 level, the CTP futures
#      default), L2 = five levels. Stored in the .mdr header so the file is
#      self-describing; L1 files are materially smaller (no deep levels).
#      Accepts `1`/`L1` or `5`/`L2`.
depth = L1

# ---- what to record: `*` = the whole market (default), or comma-separated
#      symbol prefixes (e.g. `cu, rb, IF` records those product families).
record = *

# ---- when to stop (a safety net; Ctrl+C also stops cleanly and seals).
close_hh = 15
close_mm = 30
