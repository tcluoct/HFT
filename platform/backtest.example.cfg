# backtest.example.cfg — platbt configuration.
#
#   platbt backtest.cfg --from 20260701 --to 20260716        # scan bt.dir by date
#   platbt backtest.cfg md_20260715_dc1.mdr md_20260716.mdr  # explicit files
#
# The strategy keys are IDENTICAL to platd's — including `strategies = ...`
# instance lists (any subset of types, several instances of one type with
# their own ids/params/universes; see platd.example.cfg) — so you backtest
# the exact lineup you would deploy: copy the blocks from your platd.cfg.
# The classic trio below runs when no `strategies` key is present. No counter
# or credentials are needed; platbt only reads the .mdr files.
#
# platbt selects ONE file per trading day in the range, preferring a golden
# file from `platrec --compare` (canonically ordered, gap-filled) over a
# single-datacenter recording, then the most complete sealed file.

# ------------------------------------------------------------ backtest window
# Accumulate daily .mdr files in one directory and select by date range.
# CLI --from/--to/--dir/--out override these. Dates are yyyymmdd (inclusive).
bt.dir          = D:/mktdata          # directory of recorded .mdr files
bt.from         = 20260701
bt.to           = 20260716
bt.out          = backtest_report.html
bt.report_title = platbt backtest — commodity trio
bt.capital_cny  = 1000000             # equity base for return / Sharpe / drawdown

# ---------------------------------------------------------------- strategies
momentum.enabled     = 1
momentum.instruments = cu2609, al2609
momentum.lots        = 1
momentum.imb_gate_e4 = 2000
momentum.take_ticks  = 2
momentum.stop_ticks  = 3
momentum.timeout_ms  = 5000
momentum.max_entries = 100

meanrev.enabled      = 1
meanrev.instruments  = cu2609, al2609
meanrev.ema_den      = 16
meanrev.enter_dev_ticks = 4
meanrev.imb_gate_e4  = 1000
meanrev.lots         = 1
meanrev.take_ticks   = 2
meanrev.stop_ticks   = 4
meanrev.timeout_ms   = 10000
meanrev.max_entries  = 100

breakout.enabled     = 1
breakout.instruments = cu2609, al2609
breakout.brk_ticks   = 2
breakout.imb_gate_e4 = 1500
breakout.lots        = 1
breakout.take_ticks  = 3
breakout.stop_ticks  = 3
breakout.timeout_ms  = 10000
breakout.max_entries = 50

# ---------------------------------------------------------------- risk / fees
# Wide caps for backtest so the risk gate reflects the strategy, not a limit
# breach; tighten to your live values to see how the caps bite.
risk.max_order_qty        = 100
risk.max_net_notional_cny = 100000000
risk.max_margin_cny       = 100000000
risk.max_actions_per_sec  = 100000
risk.max_actions_per_day  = 100000000

fees.fut_per_lot_cny             = 5
fees.fut_per_lot_close_today_cny = 15
