# platd.example.cfg — production site daemon configuration.
#
# Copy to platd.cfg, fill in your broker's fronts and credentials, and keep
# the real file OUT of version control (it holds account credentials).
# Front addresses and the AppID/AuthCode pair come from your futures broker
# (期货公司) when they provision CTP access with 穿透式监管 registration.
#
# For paperless testing use SimNow (see DEPLOYMENT.md §6): the same binary
# runs against SimNow fronts with your SimNow account.

# ------------------------------------------------------------- counter (CTP)
td_front   = tcp://180.168.146.187:10130   # trader front  (SimNow 7x24: 10130)
md_front   = tcp://180.168.146.187:10131   # market-data front (SimNow 7x24: 10131)
broker_id  = 9999                          # SimNow broker id; yours from the FCM
user_id    = YOUR_INVESTOR_ID
password   = YOUR_PASSWORD
investor_id =                              # defaults to user_id
app_id     = simnow_client_test            # 穿透式监管 terminal id (broker-issued)
auth_code  = 0000000000000000              # broker-issued auth code
td_flow_path = ctp_td_flow/                # CTP session-state dirs; must exist
md_flow_path = ctp_md_flow/

# ------------------------------------------------------------------- session
site_id    = 1
site_name  = SH-SHFE
epoch      = 1               # order-id epoch; bump on warm-standby takeover
account_id = 1               # internal account tag (not the broker account)
journal    = platd_shfe.jnl  # canonical-stream journal (audit + replay)
log_file   =                 # persistent session log (append + unbuffered; crash
                             # post-mortems land here too). default: <journal>.log

# ------------------------------------------------------------------ threading
# The deterministic engine is ONE thread by design (total order → replay);
# the other cores carry the CTP api threads and the async journal writer.
spin         = 0             # 1 = busy-poll the engine loop (colo); 0 = 200µs idle sleep
engine_core  = -1            # pin the engine thread to this core (-1 = unpinned)
journal_core = -1            # pin the journal writer thread (-1 = unpinned)
rt           = 0             # 1 = time-critical scheduling class for the engine

# Phase timetable (defaults to the standard futures day session shown here).
# Night sessions crossing midnight use 24h+ times, e.g. "25:00 Closed" = 01:00.
# phases = 08:55 OpenAuction, 08:59 OpenAuctionLocked, 09:00 Continuous, 10:15 Break, 10:30 Continuous, 11:30 Break, 13:30 Continuous, 15:00 Closed

# --------------------------------------------------------------- instruments
# Comma-separated CTP instrument ids, all on one venue per platd instance.
# Reference data (tick, multiplier, margin, limit band) is queried from the
# counter at startup — nothing here to keep in sync.
instruments = cu2609, al2609
default_margin_bps = 1200    # fallback when the counter omits the margin ratio

# ---------------------------------------------------------------- strategies
# Strategies are named INSTANCES. Declare the lineup with `strategies = ...`;
# each instance block sets its type, its durable id, and its parameters:
#
#   strategies   = fast_cu, slow_al, brk
#   fast_cu.type = momentum        # momentum | meanrev | breakout
#   fast_cu.id   = 1               # REQUIRED: unique nonzero id — this is what
#                                  # PnL, .positions carry and kill targets
#                                  # attribute to; never reuse it for another
#                                  # purpose once it has traded
#   fast_cu.instruments = cu2609   # defaults to the global `instruments` list
#   fast_cu.lots = 2               # type params live under the instance name
#   fast_cu.account = 1            # optional per-instance account override
#   slow_al.type = momentum        # same type again, different params — fine
#   slow_al.id   = 4
#   ...
#
# Any subset of types, several instances of one type, different params per
# site (or per fleet shard via shardN.<name>.key) — all config, no rebuild.
#
# Stopping a strategy for a while: set `<name>.enabled = 0` (or drop it from
# `strategies`) and restart platd. The instance is not constructed, but its
# id stays reserved: carried positions keep flowing through the .positions
# file each EOD (shown in the report as "carried, not running") until you
# re-enable it — it then picks its book back up — or flatten it manually.
# For an INTRADAY pause use the ops console instead: `kill strategy <id>`
# halts it at the riskgate, `disarm` re-enables (§10.3).
#
# Without a `strategies` key the classic trio below runs with the fixed ids
# momentum=1, meanrev=2, breakout=3 — existing configs work unchanged.

momentum.enabled     = 1     # delta continuation
momentum.instruments = cu2609, al2609
momentum.lots        = 1
momentum.imb_gate_e4 = 2000  # L1 imbalance gate, 1e-4 (2000 = 20%)
momentum.take_ticks  = 2
momentum.stop_ticks  = 3
momentum.timeout_ms  = 5000
momentum.max_entries = 100   # per contract

meanrev.enabled      = 1     # stretch fade toward an EMA anchor
meanrev.instruments  = cu2609, al2609
meanrev.ema_num      = 1
meanrev.ema_den      = 16
meanrev.enter_dev_ticks = 4  # stretch from anchor to act on
meanrev.imb_gate_e4  = 1000  # imbalance must OPPOSE the stretch
meanrev.lots         = 1
meanrev.take_ticks   = 2
meanrev.stop_ticks   = 4
meanrev.timeout_ms   = 10000
meanrev.max_entries  = 100

breakout.enabled     = 1     # session-range breakout
breakout.instruments = cu2609, al2609
breakout.brk_ticks   = 2     # clear the session extreme by this many ticks
breakout.imb_gate_e4 = 1500
breakout.lots        = 1
breakout.take_ticks  = 3
breakout.stop_ticks  = 3
breakout.timeout_ms  = 10000
breakout.max_entries = 50

# ---------------------------------------------------------------- risk gate
# Every limit is enforced in-line before an order can reach the gateway.
risk.max_order_qty        = 20
risk.max_order_notional_cny = 2000000
risk.max_net_notional_cny = 10000000
risk.max_margin_cny       = 5000000
risk.max_actions_per_sec  = 250       # keep below the 300/s HFT designation line
risk.max_actions_per_day  = 18000     # keep below the 20k/day line
risk.cancel_ratio_pct     = 80
risk.price_collar_ticks   = 50
risk.max_book_age_ms      = 5000
# Daily stop-loss on today's PnL (net of fees, unrealized included; carried
# lots measured from prev_close). Latches for the session: opens refused,
# closes still pass. 0 = off — set both in production.
risk.max_strategy_loss_cny = 0
risk.max_account_loss_cny  = 0
# Exchange per-contract lines, per account per day. 0 = off.
risk.max_inst_open_qty    = 0       # 日内开仓限额: set to the product's exchange line
risk.max_inst_cancels     = 450     # 单合约日撤单 >=500 is 异常交易 (CFFEX index: 400 -> use 380)
risk.check_cancel_target  = 1       # refuse cancels of dead/unknown orders and in-flight repeats
risk.cancel_retry_ms      = 1000    # a repeat cancel is allowed after this long without a report
# Cash equities (SSE/SZSE). Stocks use these instead of max_order_qty and the
# tick-count collar; board lot / 科创板 200-share minimum / odd-lot sells and
# the per-board order maximum (主板 100万, 创业板 30万, 科创板 10万) always apply.
risk.max_stock_order_qty  = 100000  # shares per order
risk.stock_cage_bps       = 200     # 价格笼子: base +-2% ...
risk.stock_cage_ticks     = 10      # ... or +-10 ticks, whichever is wider; continuous auction only
risk.stock_cage_etf       = 0       # apply the cage to ETFs/funds too
risk.st_daily_buy_qty     = 500000  # 风险警示股票: daily buys per account per stock
risk.max_stock_holding_qty = 0      # per-account single-stock shares (set below 5% of 总股本)
risk.max_stock_holding_cny = 0      # per-account single-stock value (单票集中度)

# --------------------------------------------------------------------- fees
fees.fut_per_lot_cny             = 5
fees.fut_per_lot_close_today_cny = 15
fees.fut_notional_bps            = 0

# -------------------------------------------------------------- ops console
# `platops <this file>` serves the web ops console: it TAILS the journal
# into a read-only mirror (PnL / positions / orders / risk, ~ms behind live)
# and writes operator commands to the cmd file — platd itself runs no server.
# Loopback by default; reach it remotely over an SSH tunnel. Run platops
# from platd's working directory so the relative paths resolve.
# Console verbs (stdin, `echo ... > <cmd_file>`, or the web UI):
#   halt|flatten|disarm [strat_id] | arm | status | quit
#   param <strat_id> <key> <int_value>              # live re-tune
#   order <strat_id> <sym> buy|sell open|close|closetoday <px_cny> <lots>
#   cancel <cl_id> | transfer <sym> <from> <to> long|short <lots>
#ops.port = 8848
#ops.bind = 127.0.0.1
#ops.log  = platops.log
